{% extends "base.html" %}
{% block title %}{{ code }} — BHRAM Technologies{% endblock %}
{% block content %}
<section class="auth-section">
    <div style="text-align:center; padding: 4rem 2rem;">
        <h1 style="font-size:6rem; font-weight:700; color:var(--accent); margin:0">{{ code }}</h1>
        <p style="font-size:1.25rem; color:var(--text-muted); margin:1rem 0">{{ message }}</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary">← Return to Home</a>
    </div>
</section>
{% endblock %}
