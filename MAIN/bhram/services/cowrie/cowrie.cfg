# =============================================================================
# Cowrie SSH Honeypot Configuration — BHRAM Project
# All settings are customized for the BHRAM deception environment.
# =============================================================================

[honeypot]
# ── Identity ──────────────────────────────────────────────────────────────────
# Fake hostname the attacker sees
hostname                    = bhram-prod-srv01
# Reported SSH version
ssh_version_string          = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.7

# ── Directories ───────────────────────────────────────────────────────────────
log_path                    = /home/cowrie/var/log/cowrie
download_path               = /home/cowrie/var/lib/cowrie/downloads
ttylog_path                 = /home/cowrie/var/lib/cowrie/tty
contents_path               = /home/cowrie/honeyfs

# ── Fake filesystem ───────────────────────────────────────────────────────────
filesystem_file             = /home/cowrie/honeyfs/fs.pickle

# ── Interaction limits ────────────────────────────────────────────────────────
# Max session duration in seconds (attacker kicked after this)
interactive_timeout         = 180
authentication_timeout      = 120
# Max login attempts before disconnect
auth_class_parameters       = 3

# ── Logging ───────────────────────────────────────────────────────────────────
[output_jsonlog]
enabled = true
logfile = /home/cowrie/var/log/cowrie/cowrie.json

[output_textlog]
enabled = true
logfile = /home/cowrie/var/log/cowrie/cowrie.log

[output_mysql]
enabled = false

[output_elasticsearch]
enabled = false

# ── SSH Transport ─────────────────────────────────────────────────────────────
[ssh]
enabled                     = true
listen_endpoints            = tcp:2222:interface=0.0.0.0
# SSH host key (auto-generated if not present)
rsa_public_key              = /home/cowrie/etc/ssh_host_rsa_key.pub
rsa_private_key             = /home/cowrie/etc/ssh_host_rsa_key
dsa_public_key              = /home/cowrie/etc/ssh_host_dsa_key.pub
dsa_private_key             = /home/cowrie/etc/ssh_host_dsa_key
ecdsa_public_key            = /home/cowrie/etc/ssh_host_ecdsa_key.pub
ecdsa_private_key           = /home/cowrie/etc/ssh_host_ecdsa_key
ed25519_public_key          = /home/cowrie/etc/ssh_host_ed25519_key.pub
ed25519_private_key         = /home/cowrie/etc/ssh_host_ed25519_key

# ── Telnet (disabled) ─────────────────────────────────────────────────────────
[telnet]
enabled                     = false

# ── Shell emulation ───────────────────────────────────────────────────────────
[shell]
# Fake command output responses
show_real_ip                = false
